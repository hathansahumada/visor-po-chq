  // La clave se recuerda solo mientras la pestaña siga abierta

  function guardar(v){try{sessionStorage.setItem(LLAVE_LS,v)}catch(e){}}
  function leer(){try{return sessionStorage.getItem(LLAVE_LS)}catch(e){return null}}
  function borrar(){try{sessionStorage.removeItem(LLAVE_LS)}catch(e){}}

    function guardarVista(){try{var a=document.querySelector('.tab-btn.active');sessionStorage.setItem(K,JSON.stringify({tab:a?a.getAttribute('data-tab'):null,y:window.scrollY||0}))}catch(e){}}
    document.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('.tab-btn'))setTimeout(guardarVista,0)},true);

  async function derivar(clave){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexABytes(SAL),iterations:ITER,hash:'SHA-256'},base,256);
    return bytesAHex(bits);
  }
  async function abrir(llaveHex){
    var r=await fetch('datos.bin',{cache:'no-cache'});
    if(!r.ok) throw new Error('descarga');
    var buf=new Uint8Array(await r.arrayBuffer());
    var key=await crypto.subtle.importKey('raw',hexABytes(llaveHex),'AES-GCM',false,['decrypt']);
    var plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
    var html=await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    // Quita la recarga propia del informe y agrega la nuestra (recuerda la pestaña)
    html=html.replace(/<meta[^>]*http-equiv=["']?refresh["']?[^>]*>/gi,'');
    var extra='<script>('+mantener.toString()+')('+REFRESCO+');<\/script>';
    html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,function(m){return m+extra}):extra+html;
    document.open();document.write(html);document.close();(function(){var W=1900;function fx(){var ss=document.styleSheets;for(var i=0;i<ss.length;i++){var r;try{r=ss[i].cssRules}catch(e){continue}if(!r)continue;for(var j=r.length-1;j>=0;j--){var m=r[j];if(!m.media||!m.cssRules)continue;var t=m.media.mediaText;if(/max-width/.test(t)){ss[i].deleteRule(j)}else if(/min-width/.test(t)){var c=[];for(var k=0;k<m.cssRules.length;k++)c.push(m.cssRules[k].cssText);ss[i].deleteRule(j);for(var q=0;q<c.length;q++){try{ss[i].insertRule(c[q],ss[i].cssRules.length)}catch(e){}}}}}document.documentElement.style.zoom=Math.min(1,window.innerWidth/W)}fx();setTimeout(fx,300);setTimeout(fx,2000);window.onresize=fx})();
  }
  async function intentar(llaveHex,manual){
    try{
      await abrir(llaveHex);
      if(manual) guardar(llaveHex);
    }catch(e){
      if(e&&e.message==='descarga'){msg.className='msg err';msg.textContent='No se pudo descargar el informe. Recarga la página.';}
      else{ borrar(); msg.className='msg err'; msg.textContent=manual?'Clave incorrecta.':'La clave cambió. Ingrésala de nuevo.'; }
      btn.disabled=false; f.style.display='';
    }
  }
  var guardada=leer();
  if(guardada){ f.style.display='none'; intentar(guardada,false); }
